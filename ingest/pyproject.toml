[project]
name = "swe-ingest"
version = "0.1.0"
description = "Station Warming Explorer: DWD daily climate data ingest"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
swe-ingest = "swe_ingest.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["swe_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
