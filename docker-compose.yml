services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: climate
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports: ["127.0.0.1:${PG_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d climate"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/climate
    ports: ["${API_HOST_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./web          # multi-stage: npm run build, then nginx serves dist/
    ports: ["${WEB_HOST_PORT:-8080}:80"]
    depends_on: [api]

  # One-off loader:  docker compose run --rm ingest python -m swe_ingest.cli stations
  ingest:
    build: ./ingest
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/climate
    depends_on:
      postgres: { condition: service_healthy }

  # Stretch: nightly refresh of DWD recent/ data (docker compose --profile cron up -d)
  cron:
    build: ./ingest
    profiles: ["cron"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/climate
      REFRESH_AT: "04:30"
    command: ["sh", "/app/nightly.sh"]
    depends_on:
      postgres: { condition: service_healthy }

volumes: { pgdata: {} }
